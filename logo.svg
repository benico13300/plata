<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
<title id="title">PLATA — logo vectoriel</title>
<desc id="desc">Logo doré Plata avec masque solaire géométrique d'inspiration maya.</desc>
<defs>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff5ad"/><stop offset=".25" stop-color="#ffd83e"/><stop offset=".58" stop-color="#f39b08"/><stop offset=".82" stop-color="#bd5b08"/><stop offset="1" stop-color="#ffe779"/></linearGradient>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#78300d"/><stop offset=".5" stop-color="#351307"/><stop offset="1" stop-color="#8b390b"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#ffb51c" stop-opacity=".42"/><stop offset="1" stop-color="#ff9d00" stop-opacity="0"/></radialGradient>
 <filter id="depth" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="7" result="b"/><feOffset dy="8" result="o"/><feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="80" height="80" rx="180" fill="url(#bg)"/>
<ellipse cx="512" cy="470" rx="450" ry="430" fill="url(#halo)"/>
<rect x="62" y="62" width="900" height="900" rx="142" fill="none" stroke="url(#gold)" stroke-width="20" filter="url(#depth)"/>
<rect x="84" y="84" width="856" height="856" rx="126" fill="none" stroke="#ffdf64" stroke-width="3" opacity=".55"/>
<!-- Rays -->
<g fill="url(#gold)" stroke="#78350a" stroke-width="5" stroke-linejoin="round">
 <path d="M493 126h38v66h-38z M330 169l34-24 43 61-34 24z M660 145l34 24-43 61-34-24z"/>
 <path d="M252 270l19-36 66 35-19 36z M753 269l19-36 66 35-19 36z M220 385l9-39 72 17-9 39z M795 363l72-17 9 39-72 17z"/>
</g>
<!-- Solar mask -->
<g filter="url(#depth)" stroke="#713008" stroke-width="8" stroke-linejoin="round">
 <path d="M512 174l94 38 74 83 18 104-48 94-138 54-138-54-48-94 18-104 74-83z" fill="url(#gold)"/>
 <path d="M512 202l66 28 58 65 14 81-39 75-99 39-99-39-39-75 14-81 58-65z" fill="#9e4b0a" stroke="#ffdf63"/>
 <path d="M512 220l44 28v61h-88v-61z" fill="url(#gold)"/>
 <path d="M482 253h60v38h-60z" fill="#713008"/>
 <path d="M390 335l85-20-13 53-72 8z M634 335l-85-20 13 53 72 8z" fill="url(#gold)"/>
 <path d="M512 330l-32 82h64z" fill="url(#gold)"/>
 <path d="M430 422q82 45 164 0l-16 63q-66 35-132 0z" fill="url(#gold)"/>
 <path d="M462 449h100v18H462z" fill="#713008" stroke="none"/>
 <circle cx="365" cy="420" r="31" fill="url(#gold)"/><circle cx="659" cy="420" r="31" fill="url(#gold)"/>
 <circle cx="365" cy="420" r="12" fill="#713008" stroke="none"/><circle cx="659" cy="420" r="12" fill="#713008" stroke="none"/>
</g>
<!-- stepped spiral details -->
<g fill="none" stroke="url(#gold)" stroke-width="13" stroke-linecap="square" stroke-linejoin="miter">
 <path d="M286 310h-48v48h34v-25h-14 M738 310h48v48h-34v-25h14 M286 462h-42v42h32v-22h-13 M738 462h42v42h-32v-22h13"/>
</g>
<!-- Wordmark -->
<text x="512" y="744" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="190" font-weight="bold" letter-spacing="-7" fill="url(#gold)" stroke="#713008" stroke-width="8" paint-order="stroke fill" filter="url(#depth)">Plata</text>
<text x="512" y="744" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="190" font-weight="bold" letter-spacing="-7" fill="none" stroke="#fff0a0" stroke-width="2" opacity=".8">Plata</text>
<!-- ornamental baseline -->
<g fill="none" stroke="url(#gold)" stroke-width="13" stroke-linejoin="round" filter="url(#depth)">
 <path d="M176 815h250v36h-50v28h-54v-28H176 M848 815H598v36h50v28h54v-28h146"/>
 <path d="M512 792l55 55-55 55-55-55z" fill="#713008"/><path d="M512 818l29 29-29 29-29-29z" fill="url(#gold)"/>
